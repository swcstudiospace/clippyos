name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Browser smoke against production preview
        run: |
          setsid npm run preview &
          server_pid=$!
          trap 'kill -- -"$server_pid" 2>/dev/null || true' EXIT
          timeout 60 sh -c 'until curl -fsS http://127.0.0.1:8081/ >/dev/null 2>&1; do sleep 1; done'
          curl -fsS http://127.0.0.1:8081/ >/dev/null
          mkdir -p /workspace/screenshots
          node --experimental-strip-types scripts/browser-smoke.ts http://127.0.0.1:8081/ /workspace/screenshots/ci-smoke.png
