[package]
name = "clippyos"
version = "1.0.0"
description = "ClippyOS — Autonomous Operating System for Clipping"
authors = ["ClippyOS"]
edition = "2021"
rust-version = "1.77.2"

# The WASM-compatible lib target (shared logic; window entry lives in main.rs).
[lib]
name = "clippyos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "clippyos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep release builds lean and fast to download.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
